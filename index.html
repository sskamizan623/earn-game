<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Watch & Earn</title>
<style>
body{font-family:sans-serif;background:#0f172a;color:#fff;text-align:center;padding:15px;margin:0}
.card{background:#1e293b;border-radius:15px;padding:18px;margin-bottom:14px}
.balance{font-size:28px;font-weight:bold;color:#38bdf8;margin:8px 0}
.btn{background:#2563eb;color:#fff;border:none;padding:14px;font-size:15px;font-weight:bold;border-radius:10px;width:100%;margin-top:8px;cursor:pointer}
.btn-sub{background:#8b5cf6}
.btn-ch{background:#10b981}
.btn-wd{background:#f59e0b;color:#000}
input,select{width:90%;padding:12px;margin-top:10px;border-radius:8px;border:none;font-size:15px}
</style>
</head>
<body>
<div class="card">
<h3>স্বাগতম, <span id="uName">User</span>!</h3>
<div>আপনার ব্যালেন্স</div>
<div class="balance"><span id="pts">0</span> কয়েন</div>
<small>(১,০০,০০০ কয়েন = ১,০০০ টাকা)</small>
</div>
<div class="card">
<h4>ধাপ ১: চ্যানেল সাবস্ক্রাইব (একবারই)</h4>
<p style="font-size:12px;color:#cbd5e1;margin:4px 0">আনসাবস্ক্রাইব করলে ১০০ কয়েন কেটে নেওয়া হবে</p>
<button class="btn btn-sub" id="subBtn" onclick="subCh()">চ্যানেল সাবস্ক্রাইব করুন (+১০০ কয়েন)</button>
</div>
<div class="card">
<h4>ধাপ ২: চ্যানেল ভিজিট (দিনে সর্বোচ্চ ৫ বার)</h4>
<button class="btn btn-ch" id="chBtn" onclick="goCh()">চ্যানেলে যান (+২০ কয়েন)</button>
</div>
<div class="card">
<h4>ধাপ ৩: ভিডিও দেখুন ও আয় করুন (আনলিমিটেড)</h4>
<button class="btn" onclick="goAd()">ভিডিও অ্যাড দেখুন (+৫০ কয়েন)</button>
</div>
<div class="card">
<h4>টাকা উত্তোলন (মিনিমাম ১,০০০ টাকা)</h4>
<select id="mth"><option value="bKash">বিকাশ (bKash)</option><option value="Nagad">নগদ (Nagad)</option></select>
<input type="number" id="phn" placeholder="মোবাইল নম্বর দিন">
<button class="btn btn-wd" onclick="doWd()">উইথড্র রিকোয়েস্ট (১,০০,০০০ কয়েন = ১,০০০ টাকা)</button>
</div>
<script>
var BOT_TOKEN = "9025914421";
var ADMIN_ID = "8577063798";
var CHANNEL = "@sskamizan1";
var uid = "Unknown", uFull = "User";

var TG_API = "https://" + "api.telegram.org" + "/bot" + BOT_TOKEN;
var CH_LINK = "https://" + "t.me" + "/sskamizan1";

function addScript(src, cb){
  var s = document.createElement("script");
  s.src = src;
  if(cb) s.onload = cb;
  document.head.appendChild(s);
}

addScript("https://" + "telegram.org" + "/js/" + "telegram-web-app.js", function(){
  var tg = window.Telegram && window.Telegram.WebApp;
  if(tg){
    tg.ready(); tg.expand();
    if(tg.initDataUnsafe && tg.initDataUnsafe.user){
      uFull = tg.initDataUnsafe.user.first_name;
      document.getElementById("uName").innerText = uFull;
      uid = tg.initDataUnsafe.user.id;
      checkSubStatus();
    }
  }
});

addScript("https://" + "sad." + "adsgram.ai" + "/js/" + "sad.min.js");

var pts = parseInt(localStorage.getItem("pts")) || 0;
document.getElementById("pts").innerText = pts;
function addPts(n){ pts = Math.max(0, pts + n); localStorage.setItem("pts", pts); document.getElementById("pts").innerText = pts; }

function updSubUI(done){
  var sb = document.getElementById("subBtn");
  if(done){ sb.innerText = "সাবস্ক্রাইব সম্পন্ন হয়েছে ✓"; sb.style.background = "#475569"; }
  else { sb.innerText = "চ্যানেল সাবস্ক্রাইব করুন (+১০০ কয়েন)"; sb.style.background = "#8b5cf6"; }
}
updSubUI(localStorage.getItem("sub_done") === "1");

function checkSubStatus(){
  if(uid === "Unknown" || BOT_TOKEN === "YOUR_BOT_TOKEN") return;
  fetch(TG_API + "/getChatMember?chat_id=" + CHANNEL + "&user_id=" + uid)
  .then(function(r){ return r.json(); })
  .then(function(d){
    if(d.ok){
      var st = d.result.status;
      var isMember = (st === "member" || st === "administrator" || st === "creator");
      if(!isMember && localStorage.getItem("sub_done") === "1"){
        localStorage.removeItem("sub_done"); updSubUI(false); addPts(-100);
        alert("সতর্কতা! আপনি চ্যানেল আনসাবস্ক্রাইব করায় ১০০ কয়েন কেটে নেওয়া হয়েছে!");
      }
    }
  });
}

var today = new Date().toDateString();
if(localStorage.getItem("ch_date") !== today){ localStorage.setItem("ch_date", today); localStorage.setItem("ch_cnt", "0"); }
var chCnt = parseInt(localStorage.getItem("ch_cnt")) || 0;
function updChBtn(){
  var cb = document.getElementById("chBtn");
  var rem = 5 - chCnt;
  if(rem <= 0){ cb.innerText = "আজকের ভিজিট শেষ (আগামীকাল আবার)"; cb.style.background = "#475569"; }
  else { cb.innerText = "চ্যানেলে যান (+২০ কয়েন) [" + rem + "/৫ বাকি]"; }
}
updChBtn();

function subCh(){
  if(localStorage.getItem("sub_done") === "1"){ alert("আপনি ইতিমধ্যে সাবস্ক্রাইব বোনাস নিয়েছেন!"); return; }
  var tg = window.Telegram && window.Telegram.WebApp;
  if(tg && tg.openTelegramLink){ tg.openTelegramLink(CH_LINK); } else { window.open(CH_LINK, "_blank"); }
  setTimeout(function(){
    if(uid === "Unknown" || BOT_TOKEN === "YOUR_BOT_TOKEN"){
      addPts(100); localStorage.setItem("sub_done", "1"); updSubUI(true);
      alert("চ্যানেল সাবস্ক্রাইবের জন্য ১০০ কয়েন যোগ হয়েছে!"); return;
    }
    fetch(TG_API + "/getChatMember?chat_id=" + CHANNEL + "&user_id=" + uid)
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d.ok && (d.result.status === "member" || d.result.status === "administrator" || d.result.status === "creator")){
        addPts(100); localStorage.setItem("sub_done", "1"); updSubUI(true);
        alert("ধন্যবাদ! চ্যানেল সাবস্ক্রাইবের জন্য ১০০ কয়েন যোগ হয়েছে!");
      } else { alert("আপনি এখনো চ্যানেল সাবস্ক্রাইব করেননি! চ্যানেলে Join হয়ে আবার ক্লিক করুন।"); }
    });
  }, 4000);
}

function goCh(){
  if(chCnt >= 5){ alert("আজকের জন্য সর্বোচ্চ ৫ বার ভিজিট শেষ! আগামীকাল আবার চেষ্টা করুন।"); return; }
  var tg = window.Telegram && window.Telegram.WebApp;
  if(tg && tg.openTelegramLink){ tg.openTelegramLink(CH_LINK); } else { window.open(CH_LINK, "_blank"); }
  setTimeout(function(){
    chCnt++; localStorage.setItem("ch_cnt", chCnt); updChBtn();
    addPts(20); alert("চ্যানেল ভিজিটের জন্য ২০ কয়েন যোগ হয়েছে! (আজ " + chCnt + "/৫ বার সম্পন্ন)");
  }, 2000);
}

function goAd(){
  if(window.Adsgram){
    var Ad = window.Adsgram.init({ blockId: "61370" });
    Ad.show().then(function(){
      addPts(50);
      alert("অভিনন্দন! ৫০ কয়েন যোগ হয়েছে।");
    }).catch(function(err){
      var msg = (err && err.description) ? err.description : "Adsgram ব্লকটি এখনো রিভিউতে (Created) আছে অথবা এই মুহূর্তে অ্যাড খালি নেই।";
      alert("বিজ্ঞপ্তি: " + msg);
    });
  } else {
    alert("অ্যাড স্ক্রিপ্ট এখনো লোড হচ্ছে। কয়েক সেকেন্ড অপেক্ষা করে আবার চাপ দিন!");
  }
}

function doWd(){
  var p = document.getElementById("phn").value;
  var m = document.getElementById("mth").value;
  if(pts < 100000){ alert("উইথড্র করার জন্য কমপক্ষে ১,০০,০০০ কয়েন (১,০০০ টাকা) থাকতে হবে!"); return; }
  if(!p || p.length < 11){ alert("সঠিক ১১ ডিজিটের মোবাইল নম্বর দিন!"); return; }
  
  var msg = "💸 নতুন উইথড্র রিকোয়েস্ট!\n\n👤 নাম: " + uFull + "\n🆔 আইডি: " + uid + "\n💳 মাধ্যম: " + m + "\n📱 নম্বর: " + p + "\n💰 পরিমাণ: ১,০০,০০০ কয়েন (১,০০০ টাকা)";
  
  if(BOT_TOKEN !== "YOUR_BOT_TOKEN"){
    fetch(TG_API + "/sendMessage?chat_id=" + ADMIN_ID + "&text=" + encodeURIComponent(msg));
  }
  
  addPts(-100000);
  document.getElementById("phn").value = "";
  alert("আপনার ১,০০০ টাকার উইথড্র রিকোয়েস্ট অ্যাডমিনের কাছে পাঠানো হয়েছে! শীঘ্রই পেমেন্ট পেয়ে যাবেন।");
}
</script>
</body>
</html>
